name: Secret- und Namens-Scan

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # wöchentlich, auch ohne Push

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ganze Historie: ein einmal gepushtes Secret bleibt dort

      - name: gitleaks installieren (Version und Prüfsumme fest)
        env:
          GL_VERSION: "8.30.1"
          GL_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/

      - name: Secret-Scan über die gesamte Historie
        run: gitleaks git --no-banner --redact --exit-code 1 .

      - name: Interne Namen (Liste aus dem Secret INTERNAL_NAMES)
        env:
          INTERNAL_NAMES: ${{ secrets.INTERNAL_NAMES }}
        run: python3 scripts/namen-check.py
